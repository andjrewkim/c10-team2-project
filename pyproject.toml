[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-activity-detection"
version = "0.2.0"
description = "Multi-sensor activity-detection system with ML fusion — university project."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.24",
]
train = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["sensors*", "transport*", "fusion*", "actions*", "config*", "recording*", "training*", "ui*", "src*"]

[tool.ruff]
target-version = "py311"
line-length = 99
select = ["E", "F", "I", "N", "W"]
