[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-recognition"
version = "1.0.0"
description = "Multi-sensor gesture recognition system — collect, train, evaluate, and demo."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "ruff>=0.1",
]
serial = [
    "pyserial>=3.5",
]
viz = [
    "matplotlib>=3.7",
]
gui = [
    "pyqtgraph>=0.13",
    "PyQt6>=6.5",
]
ml = [
    "joblib>=1.3",
    "scikit-learn>=1.3",
]
all = [
    "pyserial>=3.5",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyqtgraph>=0.13",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = [
    "src*",
    "src.*",
    "config*",
]
namespaces = false

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 99
select = ["E", "F", "I", "N", "W"]
