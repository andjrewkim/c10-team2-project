# fusion.example.yaml
# -----------------------------------------------------------------------
# Fusion pipeline configuration.
# -----------------------------------------------------------------------

# Which FusionStrategy to use.  The value must be an importable dotted path.
strategy: "fusion.weighted_average.WeightedAverageFusion"

# Sensor-type weights used by the weighted-average strategy.
# Unlisted types default to 1.0.
type_weights:
  mock: 1.0
  # pir:    0.8
  # mmwave: 1.2

# Fusion cycle interval in seconds (how often to fuse).
cycle_seconds: 1.0
