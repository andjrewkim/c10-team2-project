# mqtt.example.yaml
# -----------------------------------------------------------------------
# MQTT broker connection settings.
# All fields have safe defaults; override via this file or env vars.
# -----------------------------------------------------------------------

host: "localhost"           # MQTT broker hostname or IP
port: 1883                  # 1883 = non-TLS, 8883 = TLS
keepalive: 60               # keep-alive interval (seconds)
username: ~                 # set to a string if auth is required
password: ~                 # set to a string if auth is required
tls_enabled: false          # enable TLS for encrypted connections
client_id: "iot-fusion-node"
topic_prefix: ""            # prepended to every topic (e.g. "factory-a")
qos: 1                      # 0 = fire-and-forget, 1 = at-least-once, 2 = exactly-once
